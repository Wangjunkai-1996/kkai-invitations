# nginx 配置示例
# 邀请返利系统部署配置

# ============================================================
# 同域路径部署（推荐）
# Invitations API 挂载在主站 /invitations/api/ 路径下
# 前端页面路由为 /invitations
# ============================================================
server {
    listen 443 ssl;
    server_name dli.li;

    # SSL 证书配置
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Invitations API 服务（同域，cookie 自动可读）
    # 注意：proxy_pass 带 URI 路径 /api/，nginx 会将 /invitations/api/ 重写为 /api/
    location ^~ /invitations/api/ {
        proxy_pass http://127.0.0.1:6212/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # 前端页面路由 /invitations（由 new-api 处理）
    # 注意：此 location 必须在 /invitations/api/ 之后，否则会被优先匹配
    location /invitations {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主站 new-api（兜底）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# 路径说明
# ============================================================
# 前端调用                          Nginx 代理                    后端路由
# ─────────────────────────────────────────────────────────────────────────
# /invitations/api/invitations/*  →  /api/invitations/*  →  后端处理
# /invitations/api/admin/*        →  /api/admin/*        →  后端处理
# /invitations/api/system/*       →  /api/system/*       →  后端处理
# /invitations                    →  前端页面路由         →  new-api 处理
