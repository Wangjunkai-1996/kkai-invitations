name: KKAI Invitations Production Image

on:
  push:
    branches:
      - production/kkrich
    paths-ignore:
      - '**/*.md'

concurrency:
  group: kkai-invitations-production-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/wangjunkai-1996/kkai-invitations
    steps:
      - name: Check out the selected production commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Require the current production branch HEAD
        id: release
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == refs/heads/production/kkrich ]]
          [[ "${GITHUB_RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin production/kkrich
          SOURCE_SHA="$(git rev-parse HEAD)"
          [[ "${SOURCE_SHA}" == "$(git rev-parse origin/production/kkrich)" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          VERSION="kkai-prod-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}-${SOURCE_SHA:0:9}"
          echo "source_sha=${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Run the release quality gate
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.96.0 test --locked --all-targets
          bash -n build/kkai-image/verify-image.sh build/kkai-image/export-release.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the immutable Linux AMD64 image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: build/kkai-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ steps.release.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.release.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Pull and verify the immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          EXPECTED_SHA="${SOURCE_SHA}" EXPECTED_VERSION="${VERSION}" \
            EXPECTED_REGISTRY_DIGEST="${DIGEST}" \
            build/kkai-image/verify-image.sh "${IMAGE}@${DIGEST}"

      - name: Prepare security reports
        run: mkdir -p dist

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output: dist/sbom.spdx.json

      - name: Generate vulnerability and secret report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln,secret
          format: json
          output: dist/trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Revalidate the current production branch HEAD
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          git fetch --no-tags origin production/kkrich
          [[ "${SOURCE_SHA}" == "$(git rev-parse origin/production/kkrich)" ]]

      - name: Promote and sign the scanned digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${SOURCE_SHA}" \
            "${IMAGE}@${DIGEST}"
          PROMOTED_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "${PROMOTED_DIGEST}" == "${DIGEST}" ]]
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Export and sign the offline release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/kkai-production-image.yml@${{ github.ref }}
        run: |
          build/kkai-image/export-release.sh \
            "${IMAGE}@${DIGEST}" "${VERSION}" "${SOURCE_SHA}" "${DIGEST}" dist
          cosign sign-blob --yes \
            --bundle dist/offline-release.sigstore.json \
            dist/offline-release.yml
          cosign verify-blob \
            --bundle dist/offline-release.sigstore.json \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/offline-release.yml

      - name: Upload immutable release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: invitations-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release summary
        if: success()
        run: |
          {
            echo '### KKAI Invitations production image'
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- Source: \`${{ steps.release.outputs.source_sha }}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
